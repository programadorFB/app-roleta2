services:
  roleta2_backend:
    container_name: roleta2_backend
    build:
      context: ./roleta2/
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      # ── Node ────────────────────────────────────
      - NODE_ENV=production
      - PORT=3001

      # ── Identidade ──────────────────────────────
      - APP_NAME=roleta2
      - REDIS_PREFIX=roleta2

      # ── URLs ────────────────────────────────────
      - FRONTEND_URL=https://tool.smartanalise.com.br
      - BACKEND_PUBLIC_URL=https://tool-api.smartanalise.com.br
      - BACKEND_PUBLIC_WSS_URL=wss://tool-api.smartanalise.com.br

      # ── CORS ────────────────────────────────────
      - CORS_ORIGINS=https://tool.smartanalise.com.br,http://localhost:5173,http://localhost:3001

      # ── Database ────────────────────────────────
      - DB_HOST=postgres_principal
      - DB_PORT=5432
      - DB_NAME=phantom-roleta
      - DB_USER=postgres
      - DB_PASSWORD=UtLzuw7fh5XyfTLZ3S1bwaczwf1JF8GntdbtywtT

      # ── Redis ───────────────────────────────────
      - REDIS_URL=redis://redis:6379

      # ── Segurança / Auth ────────────────────────
      - CRAWLER_SECRET=cr4wl3r-s3cr3t-local-dev
      - ADMIN_SECRET=JrI9EK_ja8ZrJae7diAV3fawPzSYtWuy-lbbuYZ2H0_orgO1ko0_aLe_8t04pkaGAJjtPeVZCCCLGQCbv0pwOg
      # Assinatura HMAC das rotas /api/. Precisa ser IDENTICA ao build arg do
      # frontend. 'observe' registra sem bloquear; 'enforce' bloqueia.
      - API_SIGNING_SECRET=${API_SIGNING_SECRET}
      - API_SIGNING_SECRET_PREVIOUS=${API_SIGNING_SECRET_PREVIOUS:-}
      - API_SIGNING_MODE=${API_SIGNING_MODE:-observe}
      - HMAC_WINDOW_SECONDS=${HMAC_WINDOW_SECONDS:-300}
      # Exige conta existente nas rotas de dados.
      - ACCOUNT_CHECK_MODE=${ACCOUNT_CHECK_MODE:-observe}
      # Autenticacao real: valida o Bearer no emissor e confirma que o token
      # pertence ao userEmail da query. 'observe' registra sem bloquear.
      - TOKEN_AUTH_MODE=${TOKEN_AUTH_MODE:-observe}
      - TOKEN_AUTH_TIMEOUT_MS=${TOKEN_AUTH_TIMEOUT_MS:-4000}
      # Politica anti-scraping.
      - BAN_MODE=${BAN_MODE:-observe}
      - BAN_DAYS=${BAN_DAYS:-15}
      - ABUSE_RATE_PER_MIN=${ABUSE_RATE_PER_MIN:-240}

      # ── Area administrativa (/admin) ────────────
      # Cerca de rede na frente do painel. VAZIAS = painel exposto a qualquer
      # IP, com so a senha protegendo — o backend grita isso no boot.
      - ADMIN_ALLOWED_IPS=${ADMIN_ALLOWED_IPS:-}
      - ADMIN_REQUIRE_CF_ACCESS=${ADMIN_REQUIRE_CF_ACCESS:-false}
      # true mascara CPF/telefone na lista e na ficha; o valor inteiro passa a
      # sair so pela rota /pii, que exige admin nominal e deixa rastro.
      - ADMIN_MASK_PII=${ADMIN_MASK_PII:-false}
      # Telemetria que alimenta o painel. SEM o salt o IP nao e gravado em
      # lugar nenhum — nem na sessao de uso, nem na auditoria do admin.
      - TELEMETRY_IP_SALT=${TELEMETRY_IP_SALT:-}
      - TELEMETRY_EVENT_RETENTION_DAYS=${TELEMETRY_EVENT_RETENTION_DAYS:-90}
      - TELEMETRY_SESSION_RETENTION_DAYS=${TELEMETRY_SESSION_RETENTION_DAYS:-180}
      # Espelho do cadastro na casa, lido no login. Cai no AUTH_PROXY_TARGET
      # quando nao definida — so aponte para outro host se /profile e /wallet
      # morarem em lugar diferente do emissor do token.
      - PLATFORM_API_URL=${PLATFORM_API_URL:-}
      - PLATFORM_SYNC_TIMEOUT_MS=${PLATFORM_SYNC_TIMEOUT_MS:-6000}
      - BRAND=${BRAND:-betou}

      - HUBLA_WEBHOOK_TOKEN=x11H8dJDrNRQBZTxicwFObMkk3LG6gSMBwAi5CxGYlRp1JuwRZZsxWm81NSZEgEJ
      - HUBLA_CHECKOUT_URL=https://pay.hub.la/N7JdmojxORlRpaafFEyl
      - AUTH_PROXY_TARGET=https://api.appbackend.tech

      # ── Marca (links cross-app no rodapé do email) ──
      - BRAND_GERENCIAMENTO_URL=https://appgerenciamento.smartanalise.com.br
      - BRAND_LABORATORIO_URL=https://laboratorio.smartanalise.com.br
      - BRAND_ACADEMY_URL=https://members.smartanalise.com.br

      # ── APIs externas (fontes de dados) ─────────
      - API_URL_IMMERSIVEVIP=https://apptemporario-production.up.railway.app/api/bd9c8298-1453-4694-8d9c-b32be9f972e7
      - API_URL_IMMERSIVE=https://apptemporario-production.up.railway.app/api/0194b479-654d-70bd-ac50-9c5a9b4d14c5
      - API_URL_BRASILEIRA=https://apptemporario-production.up.railway.app/api/0194b473-2ab3-778f-89ee-236e803f3c8e
      - API_URL_BRASILPLAY=https://roleta-api.sortehub.online/api/compat/brasileira?limit=200
      - API_URL_SPEED=https://apptemporario-production.up.railway.app/api/0194b473-c347-752f-9eaf-783721339479
      - API_URL_XXXTREME=https://apptemporario-production.up.railway.app/api/0194b478-5ba0-7110-8179-d287b2301e2e
      - API_URL_VIPAUTO=https://apptemporario-production.up.railway.app/api/0194b473-9044-772b-a6fc-38236eb08b42
      - API_URL_AUTO=https://apptemporario-production.up.railway.app/api/0194b471-1645-749e-9214-be0342035f6f
      - API_URL_VIP=https://apptemporario-production.up.railway.app/api/0194b472-6b93-74be-9260-7e407f5f1103
      - API_URL_LIGHTNING=https://apptemporario-production.up.railway.app/api/0194b472-7d68-75ea-b249-1422258f4d4c
      - API_URL_AOVIVO=https://apptemporario-production.up.railway.app/api/0194b473-1738-70dd-84a9-f1ddd4f00678
      - API_URL_SPEEDAUTO=https://apptemporario-production.up.railway.app/api/0194b473-3139-770c-841f-d026ce7ed01f
      - API_URL_VIPROULETTE=https://apptemporario-production.up.railway.app/api/0194b474-bb9a-7451-b430-c451b14de1de
      - API_URL_RELAMPAGO=https://apptemporario-production.up.railway.app/api/0194b474-d82f-76e0-9242-70f601984069
      - API_URL_MALTA=https://apptemporario-production.up.railway.app/api/0194b476-6091-730c-b971-7e66d9d8c44a

      # ── Email (SMTP) ────────────────────────────
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=devfuzabalta@gmail.com
      - SMTP_PASS=ipnhawzakasewcxu
      - SMTP_SENDER_NAME=Smart Analise

      # ── Monitoramento ───────────────────────────
      - SENTRY_DSN=https://1524b8f488f4292a3be4380d2a608b18@o4510381163675648.ingest.us.sentry.io/4510381187334144

      # ── PM2 cluster ─────────────────────────────
      - PM2_INSTANCES=1
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - GERENCIAMENTO_BACKEND_URL=http://gerenciamento_backend_roleta2:5004
      - FETCH_INTERVAL_MS=5000
      - DB_POOL_MAX=30
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - rede_externa

  roleta2_frontend:
    container_name: roleta2_frontend
    build:
      context: ./roleta2/
      dockerfile: ./src/Dockerfile
      args:
        VITE_API_URL: https://tool-api.smartanalise.com.br
        VITE_AFFILIATE_URL: https://go.aff.betou.bet.br/tgml0e19?utm_medium=appcmd
        API_SIGNING_SECRET: ${API_SIGNING_SECRET}
    ports:
      - "81:81"
    environment:
      - NGINX_PORT=81
      - BACKEND_PUBLIC_URL=https://tool-api.smartanalise.com.br
      - BACKEND_PUBLIC_WSS_URL=wss://tool-api.smartanalise.com.br
      - AUTH_PROXY_TARGET=https://api.appbackend.tech
    depends_on:
      - roleta2_backend
    restart: unless-stopped
    networks:
      - rede_externa

  cloudflared:
    container_name: roleta2_tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run --token eyJhIjoiOGQ2YTZmYWY4YzMwM2EzNDU2YzNlZDUwMGYzNjBlNDciLCJ0IjoiYjg0YzFmNTgtNDMzMi00MWQ5LTg5NjAtZDIzM2FhYTdjYWRmIiwicyI6Ik1UTmlPR1V4WVRVdE1HRmxOaTAwTlRNeUxUbGlPRFV0T0RJMk9XRXhZVEEwTWpKbE1UQmxaakk0TldZdE56WTVNeTAwTVRNeExXSmlZamd0TTJZd016WXhZakpoWlRnNSJ9
    depends_on:
      - roleta2_frontend
    restart: unless-stopped
    networks:
      - rede_externa

  gerenciamento_backend:
    container_name: gerenciamento_backend_roleta2
    build:
      context: ./gerenciamento_backend/
      dockerfile: Dockerfile
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:UtLzuw7fh5XyfTLZ3S1bwaczwf1JF8GntdbtywtT@postgres_principal:5432/phantom-roleta
      - DB_POOL_SIZE=5
      - DB_POOL_MAX_OVERFLOW=10
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      rede_externa:
        aliases:
          - gerenciamento_backend_roleta2

networks:
  rede_externa:
    external: true
    name: rede_externa
